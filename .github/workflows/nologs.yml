name: Nologs
on:
  push:
    branches:
      - main
permissions:
  contents: write
  actions: write
jobs:
  truncate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          fetch-depth: 1
      - name: Reset Repository History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf .git
          git init
          git checkout -b main
          git add -A
          git commit -m "Latest production release"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@://github.com{{ github.repository }}.git"
          git push origin main --force
      - name: Purge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          runs=$(gh api -X GET "/repos/${{ github.repository
          }}/actions/workflows/nologs.yml/runs" --jq '.workflow_runs[].id')

          for id in $runs; do
            if [ "$id" != "$CURRENT_RUN_ID" ]; then
              echo "Deleting workflow run: $id"
              gh api -X DELETE "/repos/${{ github.repository }}/actions/runs/$id" || true
            fi
          done
          
